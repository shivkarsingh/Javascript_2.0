<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="/07_Projects/p2/p2styles.css">
</head>
<body>

    <header class="mainHead">
        <h1>BMI Calculator</h1>
    </header>

    <section class="content">

        <form class="input" >

            <p class="inputHt"> 
                <label>Height in cm : </label>
                <input type="text" id="ht" placeholder="Enter height">
            </p>

            <p class="inputWt">
                <label>Weight in kg : </label>
                <input type="text" id="wt" placeholder="Enter weight">
            </p>

            <button class="calculate">Calculate</button>

        </form>

    </section>

    <footer class="display">

        <div class="results"></div>

        <div class="Info">

            <h3> BMI Weight Guide</h3>
            <p>Under Weight = Less than 18.6</p>
            <p>Normal Range = 18.6 and 24.9</p>
            <p>Overweight = Greater than 24.9</p>

        </div>

    </footer>

    <script src="/07_Projects/p2/p2script.js"></script>
</body>
</html>
