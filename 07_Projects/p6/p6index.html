<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Check</title>
  <link rel="stylesheet" href="./p6styles.css">
</head>

<body>

  <main class="content">

    <div class="display">
      <div class="table">
        <table>
          
          <thead>
            <tr>
              <th>Key</th>
              <th>Key Code</th>
              <th>Code</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td id="key">-</td>
              <td id="keyCode">-</td>
              <td id="code">-</td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>

    <div class="text">Press any key and see the magic ✨</div>

  </main>

  <script src="./p6script.js"></script>
</body>
</html>
