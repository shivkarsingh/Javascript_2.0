<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./p7styles.css">
    <title>Weather App</title>
</head>
<body>
    
    <div class="card">

        <div class="search">

            <input type="text" placeholder="Enter city name " spellcheck="false">

            <button>
                <img src="./img/search.png" alt="search_icon">
            </button>

        </div>

        <div class="error">
            <p>Invalid city name!</p>
        </div>

        <div class="weather">

            <img src="./img/rain.png" alt="weather_icon" class="weather-icon">

            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>

            <div class="details">

                <div class="col">

                    <img src="./img/humidity.png" alt="humidity_img">

                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>

                </div>

                <div class="col">

                    <img src="./img/wind.png" alt="wind_img">

                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Humidity</p>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="./p7script.js"></script>
</body>
</html>
