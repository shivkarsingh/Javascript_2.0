<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <link rel="stylesheet" href="./p8styles.css">
</head>
<body>

  <div class="container">

    <div class="card">

      <h1>QR Code Generator</h1>
      <p>Enter text or URL to generate QR</p>

      <div class="inputBox">
        <input type="text" placeholder="Enter text or URL..." spellcheck="false">
      </div>

      <div class="qrBox">
        <img src="" alt="">
      </div>

      <div class="error">
            <p>Please do not leave empty!</p>
      </div>

      <button class="generateBtn">Generate QR</button>

    </div>

    <script src="./p8script.js"></script>

  </div>

</body>
</html>
